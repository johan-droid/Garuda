# Serves the built Garuda frontend and proxies API calls to the backend.
#
# Mirrors what Vite's dev proxy does (`/api` -> 127.0.0.1:8000, changeOrigin),
# so the browser sees a single origin in development and in the container. That
# matters because the app reads relative `/api/...` paths and the backend's CORS
# list is explicit - a cross-origin deployment has to be configured, not assumed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is content-hashed by Vite, so it is safe to cache hard; the
    # entry point is not, or a deploy would leave readers on the old shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # `/health` is the app's own liveness probe: `checkHealth()` fetches it and
    # parses JSON. Without this it falls through to the SPA fallback and returns
    # index.html, so `res.json()` throws and the UI reports the backend as
    # offline while it is actually healthy - the search still worked, which made
    # it look like a caching success rather than a broken probe.
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The profile and imagery endpoints fan out to upstream providers, which
        # can take several seconds; nginx's 60s default is too short.
        proxy_read_timeout 120s;
    }

    # Single-page app: unknown paths fall back to the shell rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
